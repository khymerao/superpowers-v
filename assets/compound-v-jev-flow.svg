<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How Compound V uses Jev</title>
  <desc>Compound V decides the tier of a change request exactly as before, and that decision goes straight to you. In the background, Compound V writes the same question to a local file with no key and secrets removed; the compound-v-vault plugin adds the key and asks Jev; Jev's answer is saved next to Claude's, for comparison only. The key lives only in the vault, Jev never changes a decision, and without the vault or the repository's consent nothing is sent.</desc>

  <defs>
    <linearGradient id="brandbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1195f2"/><stop offset="0.5" stop-color="#6565f2"/><stop offset="1" stop-color="#dc02df"/>
    </linearGradient>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8db0"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6565f2"/></marker>
    <filter id="gMag" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#dc02df" flood-opacity="0.55"/></filter>
    <filter id="gBlue" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#1195f2" flood-opacity="0.55"/></filter>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#0b0b22"/>
  <rect x="0" y="0" width="1000" height="6" fill="url(#brandbar)"/>

  <text x="40" y="58" font-size="28" font-weight="800" letter-spacing="-0.4" fill="#ebebee">How Compound&#160;V uses Jev</text>
  <text x="40" y="84" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="2" fill="#7f86a8">JEV IS ASKED ALONGSIDE, FOR COMPARISON · IT NEVER CHANGES THE DECISION</text>

  <!-- main path -->
  <text x="40" y="132" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.4" fill="#7f86a8">WHAT YOU SEE</text>

  <rect x="40" y="146" width="240" height="78" rx="12" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="160" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#ebebee">You ask for a change</text>
  <text x="160" y="202" font-size="13" text-anchor="middle" fill="#aeb0c2">an ordinary prompt</text>

  <line x1="280" y1="185" x2="356" y2="185" stroke="#8a8db0" stroke-width="2" marker-end="url(#aN)"/>

  <rect x="360" y="146" width="280" height="78" rx="12" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="500" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#ebebee">Compound V sizes it</text>
  <text x="500" y="202" font-size="13" text-anchor="middle" fill="#aeb0c2">with Claude, exactly as before</text>

  <line x1="640" y1="185" x2="716" y2="185" stroke="#8a8db0" stroke-width="2" marker-end="url(#aN)"/>

  <rect x="720" y="146" width="240" height="78" rx="12" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="840" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#ebebee">You get the decision</text>
  <text x="840" y="202" font-size="13" text-anchor="middle" fill="#aeb0c2">unchanged, no waiting</text>

  <!-- background path -->
  <path d="M500 224 L500 262" fill="none" stroke="#6565f2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aV)"/>
  <text x="512" y="250" font-size="12.5" fill="#9b9cf6">meanwhile, in the background</text>

  <rect x="24" y="268" width="952" height="160" rx="14" fill="none" stroke="#2b2b5c" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="40" y="292" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.4" fill="#7f86a8">IN THE BACKGROUND</text>

  <rect x="40" y="306" width="210" height="96" rx="12" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="145" y="338" font-size="15.5" font-weight="700" text-anchor="middle" fill="#ebebee">1 · Question</text>
  <text x="145" y="360" font-size="12.5" text-anchor="middle" fill="#aeb0c2">written to a local file,</text>
  <text x="145" y="378" font-size="12.5" text-anchor="middle" fill="#aeb0c2">secrets removed, no key</text>

  <line x1="250" y1="354" x2="282" y2="354" stroke="#8a8db0" stroke-width="2" marker-end="url(#aN)"/>

  <rect x="286" y="306" width="210" height="96" rx="12" fill="#14112f" stroke="#dc02df" stroke-width="1.8" filter="url(#gMag)"/>
  <text x="391" y="338" font-size="15.5" font-weight="700" text-anchor="middle" fill="#ef6bf1">2 · Vault</text>
  <text x="391" y="360" font-size="12.5" text-anchor="middle" fill="#cdcfdd">adds the key and sends</text>
  <text x="391" y="378" font-size="12.5" text-anchor="middle" fill="#cdcfdd">the question to Jev</text>

  <line x1="496" y1="354" x2="528" y2="354" stroke="#8a8db0" stroke-width="2" marker-end="url(#aN)"/>

  <rect x="532" y="306" width="190" height="96" rx="12" fill="#0f1a33" stroke="#1195f2" stroke-width="1.8" filter="url(#gBlue)"/>
  <text x="627" y="338" font-size="15.5" font-weight="700" text-anchor="middle" fill="#4db3f7">3 · Jev</text>
  <text x="627" y="360" font-size="12.5" text-anchor="middle" fill="#cdcfdd">answers via</text>
  <text x="627" y="378" font-size="12.5" text-anchor="middle" fill="#cdcfdd">OpenRouter</text>

  <line x1="722" y1="354" x2="754" y2="354" stroke="#8a8db0" stroke-width="2" marker-end="url(#aN)"/>

  <rect x="758" y="306" width="202" height="96" rx="12" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="859" y="338" font-size="15.5" font-weight="700" text-anchor="middle" fill="#ebebee">4 · Comparison</text>
  <text x="859" y="360" font-size="12.5" text-anchor="middle" fill="#aeb0c2">Jev's answer saved</text>
  <text x="859" y="378" font-size="12.5" text-anchor="middle" fill="#aeb0c2">next to Claude's</text>

  <!-- rules -->
  <rect x="40" y="458" width="290" height="70" rx="12" fill="#14112f" stroke="#3a2b5a" stroke-width="1.2"/>
  <text x="185" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="#ef6bf1">The key lives only in the vault</text>
  <text x="185" y="508" font-size="12" text-anchor="middle" fill="#aeb0c2">Compound V never sees it</text>

  <rect x="355" y="458" width="290" height="70" rx="12" fill="#111133" stroke="#2b2b5c" stroke-width="1.2"/>
  <text x="500" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">Jev never changes a decision</text>
  <text x="500" y="508" font-size="12" text-anchor="middle" fill="#aeb0c2">its answers are only compared</text>

  <rect x="670" y="458" width="290" height="70" rx="12" fill="#0f1a33" stroke="#1d3a66" stroke-width="1.2"/>
  <text x="815" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="#4db3f7">No consent → nothing is sent</text>
  <text x="815" y="508" font-size="12" text-anchor="middle" fill="#aeb0c2">allowed per repository</text>
</svg>
