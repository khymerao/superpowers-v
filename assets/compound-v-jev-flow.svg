<svg viewBox="0 0 1100 1010" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How Compound V consults Jev, shadow-first</title>
  <desc>Compound V never holds the OpenRouter key. For T3 triage the hook decides the tier exactly as before; only when T3 ran and Jev is on, it leaves a descriptor, compound-v-jev.py writes a redacted request file, and the jev-t3 module asks the compound-v-vault plugin after the classic hook has answered. The vault holds the key in secure storage, checks per-repository egress consent, and is the only program that calls OpenRouter's System One route to TypeSafe's Jev. The response is parsed in shadow mode into telemetry and shadow pairs; the hook's output is returned unchanged. In onboarding a deterministic UI floor runs first; only on no-ui is a sample sent, with secret-bearing files left out, and Jev may only turn no-ui into ui or add taxonomy rows. When Jev is unavailable every consumer runs today's path.</desc>

  <defs>
    <linearGradient id="brandbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1195f2"/><stop offset="0.5" stop-color="#6565f2"/><stop offset="1" stop-color="#dc02df"/>
    </linearGradient>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a6d90"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc02df"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1195f2"/></marker>
    <filter id="gMag" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#dc02df" flood-opacity="0.55"/></filter>
    <filter id="gBlue" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#1195f2" flood-opacity="0.55"/></filter>
  </defs>

  <rect x="0" y="0" width="1100" height="1010" fill="#0b0b22"/>
  <rect x="0" y="0" width="1100" height="6" fill="url(#brandbar)"/>

  <text x="30" y="56" font-size="27" font-weight="800" letter-spacing="-0.4" fill="#ebebee">How Compound&#160;V consults Jev, shadow-first</text>
  <text x="30" y="81" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="2.2" fill="#7f86a8">THE KEY STAYS IN THE VAULT · JEV OBSERVES, IT NEVER DECIDES THE TIER</text>

  <!-- column headers -->
  <text x="220" y="116" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.4" text-anchor="middle" fill="#7f86a8">COMPOUND V · NO KEY</text>
  <text x="595" y="116" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.4" text-anchor="middle" fill="#dc02df">COMPOUND-V-VAULT · KEY HOLDER</text>
  <text x="930" y="116" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.4" text-anchor="middle" fill="#4db3f7">OFF THE MACHINE</text>
  <line x1="440" y1="104" x2="440" y2="850" stroke="#23234a" stroke-width="1"/>
  <line x1="755" y1="104" x2="755" y2="850" stroke="#23234a" stroke-width="1"/>

  <!-- ========== 1. T3 ========== -->
  <text x="30" y="146" font-size="13" font-weight="800" letter-spacing="1" fill="#ebebee">1 · T3 TRIAGE, IN SHADOW</text>

  <rect x="30" y="158" width="380" height="40" rx="10" fill="#111133" stroke="#575868" stroke-width="1.3"/>
  <text x="220" y="183" font-size="15" font-weight="700" text-anchor="middle" fill="#ebebee">Your change request</text>
  <line x1="220" y1="198" x2="220" y2="216" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>

  <rect x="30" y="218" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="240" font-size="15" font-weight="700" text-anchor="middle" fill="#ebebee">Triage hook decides the tier</text>
  <text x="220" y="259" font-size="12" text-anchor="middle" fill="#aeb0c2">Claude or Codex classifies T3, exactly as before</text>
  <line x1="220" y1="272" x2="220" y2="290" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>

  <rect x="30" y="292" width="380" height="54" rx="10" fill="#14143a" stroke="#6565f2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="220" y="314" font-size="14" font-weight="700" text-anchor="middle" fill="#cdcfdd">Only if T3 ran and CV_JEV_T3=1</text>
  <text x="220" y="333" font-size="12" text-anchor="middle" fill="#aeb0c2">the hook leaves a pending descriptor for this session</text>
  <line x1="220" y1="346" x2="220" y2="364" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>

  <rect x="30" y="366" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="388" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">compound-v-jev.py build --point t3</text>
  <text x="220" y="407" font-size="12" text-anchor="middle" fill="#aeb0c2">req/&lt;uuid&gt;.req.json · 0600 · ≤ 2,000 chars · redacted</text>
  <line x1="220" y1="420" x2="220" y2="438" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>

  <rect x="30" y="440" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="462" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">hooks/jev-t3.tsx, after the hook answered</text>
  <text x="220" y="481" font-size="12" text-anchor="middle" fill="#aeb0c2">reads the descriptor, asks the vault: $.jev.classify</text>

  <rect x="30" y="532" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="554" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">compound-v-jev.py parse --mode shadow → pair</text>
  <text x="220" y="573" font-size="12" text-anchor="middle" fill="#aeb0c2">calls.jsonl · shadow-pairs.jsonl (Jev next to Claude)</text>
  <text x="220" y="606" font-size="12" font-weight="700" text-anchor="middle" fill="#6565f2">the hook's output is returned unchanged</text>

  <!-- vault box (T3) -->
  <rect x="470" y="292" width="250" height="294" rx="12" fill="#14112f" stroke="#dc02df" stroke-width="1.8" filter="url(#gMag)"/>
  <text x="595" y="320" font-size="16.5" font-weight="800" text-anchor="middle" fill="#ef6bf1">compound-v-vault</text>
  <text x="595" y="338" font-size="12" text-anchor="middle" fill="#7f86a8">a separate plugin (mod)</text>
  <text x="595" y="366" font-size="12.5" text-anchor="middle" fill="#cdcfdd">OpenRouter key in secure storage</text>
  <text x="595" y="386" font-size="12.5" text-anchor="middle" fill="#cdcfdd">egress consent per repository</text>
  <text x="595" y="406" font-size="12.5" text-anchor="middle" fill="#cdcfdd">$.jev.status · $.jev.classify</text>
  <text x="595" y="426" font-size="12.5" text-anchor="middle" fill="#cdcfdd">tool: jev_classify(request_file)</text>
  <text x="595" y="446" font-size="12.5" text-anchor="middle" fill="#cdcfdd">writes resp/&lt;uuid&gt;.resp.json</text>
  <line x1="490" y1="466" x2="700" y2="466" stroke="#3a2b5a" stroke-width="1"/>
  <text x="595" y="488" font-size="12" font-weight="700" text-anchor="middle" fill="#ef6bf1">the key leaves only as the</text>
  <text x="595" y="504" font-size="12" font-weight="700" text-anchor="middle" fill="#ef6bf1">Authorization header</text>
  <text x="595" y="528" font-size="12" text-anchor="middle" fill="#aeb0c2">error bodies are never read</text>
  <text x="595" y="544" font-size="12" text-anchor="middle" fill="#aeb0c2">(they carry the account's user_id)</text>
  <text x="595" y="570" font-size="11.5" text-anchor="middle" fill="#7f86a8">sets CV_JEV_T3 only when on + t3: shadow</text>

  <!-- Jev box (T3) -->
  <rect x="790" y="362" width="280" height="118" rx="12" fill="#0f1a33" stroke="#1195f2" stroke-width="1.8" filter="url(#gBlue)"/>
  <text x="930" y="390" font-size="15" font-weight="800" text-anchor="middle" fill="#4db3f7">OpenRouter System One</text>
  <text x="930" y="412" font-size="13" text-anchor="middle" fill="#cdcfdd">→ TypeSafe Jev</text>
  <text x="930" y="432" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle" fill="#cdcfdd">typesafe/jev-1.13</text>
  <text x="930" y="458" font-size="12" text-anchor="middle" fill="#aeb0c2">answers with probabilities</text>

  <!-- T3 arrows -->
  <line x1="410" y1="467" x2="468" y2="467" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>
  <text x="439" y="458" font-size="10.5" text-anchor="middle" fill="#7f86a8">request</text>
  <line x1="720" y1="396" x2="788" y2="396" stroke="#dc02df" stroke-width="1.7" marker-end="url(#aM)"/>
  <rect x="722" y="377" width="64" height="15" fill="#0b0b22"/>
  <text x="754" y="388" font-size="10.5" text-anchor="middle" fill="#ef6bf1">HTTPS + key</text>
  <line x1="790" y1="446" x2="722" y2="446" stroke="#1195f2" stroke-width="1.7" marker-end="url(#aB)"/>
  <rect x="736" y="451" width="36" height="15" fill="#0b0b22"/>
  <text x="754" y="462" font-size="10.5" text-anchor="middle" fill="#4db3f7">answer</text>
  <path d="M470 560 L440 560 L440 559 L412 559" fill="none" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>
  <text x="440" y="550" font-size="10.5" text-anchor="middle" fill="#7f86a8">response</text>

  <!-- ========== 2. Onboard ========== -->
  <text x="30" y="650" font-size="13" font-weight="800" letter-spacing="1" fill="#ebebee">2 · /v:onboard, UI DETECTION AND LAYERS</text>

  <rect x="30" y="662" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="684" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">Deterministic detect_ui floor first</text>
  <text x="220" y="703" font-size="12" text-anchor="middle" fill="#aeb0c2">WordPress · Blade · Twig · Liquid · SwiftUI · JSX/Vue</text>
  <line x1="220" y1="716" x2="220" y2="734" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>
  <text x="232" y="730" font-size="10.5" fill="#7f86a8">no-ui only (ui → done, Jev not asked)</text>

  <rect x="30" y="736" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="758" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">jev-requests: ≤ 12 files × 20 lines</text>
  <text x="220" y="777" font-size="12" text-anchor="middle" fill="#aeb0c2">secret-named files and credential lines left out</text>
  <line x1="220" y1="790" x2="220" y2="808" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>

  <rect x="30" y="810" width="380" height="54" rx="10" fill="#111133" stroke="#575868" stroke-width="1.5"/>
  <text x="220" y="832" font-size="14" font-weight="700" text-anchor="middle" fill="#ebebee">detect-ui / draft-taxonomy --jev-responses</text>
  <text x="220" y="851" font-size="12" text-anchor="middle" fill="#aeb0c2">Jev may only turn no-ui into ui and add rows</text>

  <rect x="470" y="736" width="250" height="54" rx="10" fill="#14112f" stroke="#dc02df" stroke-width="1.5"/>
  <text x="595" y="758" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ef6bf1">jev_classify tool</text>
  <text x="595" y="777" font-size="12" text-anchor="middle" fill="#aeb0c2">once per request file</text>
  <rect x="790" y="736" width="280" height="54" rx="10" fill="#0f1a33" stroke="#1195f2" stroke-width="1.5"/>
  <text x="930" y="758" font-size="13.5" font-weight="700" text-anchor="middle" fill="#4db3f7">Jev</text>
  <text x="930" y="777" font-size="12" text-anchor="middle" fill="#aeb0c2">UI? · which layer?</text>
  <line x1="410" y1="763" x2="468" y2="763" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>
  <line x1="720" y1="756" x2="788" y2="756" stroke="#dc02df" stroke-width="1.7" marker-end="url(#aM)"/>
  <line x1="790" y1="772" x2="722" y2="772" stroke="#1195f2" stroke-width="1.7" marker-end="url(#aB)"/>
  <path d="M595 790 L595 837 L412 837" fill="none" stroke="#6a6d90" stroke-width="1.6" marker-end="url(#aN)"/>
  <text x="600" y="826" font-size="10.5" fill="#7f86a8">response files</text>

  <!-- ========== bottom panels ========== -->
  <rect x="30" y="884" width="510" height="78" rx="10" fill="#111133" stroke="#575868" stroke-width="1.2"/>
  <text x="46" y="907" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.2" fill="#7f86a8">LOCAL DATA</text>
  <text x="46" y="928" font-size="12.5" font-family="ui-monospace, monospace" fill="#cdcfdd">~/.claude/compound-v-jev/&lt;repo-digest&gt;/</text>
  <text x="46" y="949" font-size="12" fill="#aeb0c2">0700 · files 0600 · 30-day retention · never under the repository</text>

  <rect x="560" y="884" width="510" height="78" rx="10" fill="#111133" stroke="#575868" stroke-width="1.2"/>
  <text x="576" y="907" font-size="12" font-family="ui-monospace, monospace" letter-spacing="1.2" fill="#7f86a8">JEV OFF → TODAY'S PATH</text>
  <text x="576" y="928" font-size="12" fill="#cdcfdd">no vault · egress not allowed · no_key · timeout · 429 · 5xx · 401/403</text>
  <text x="576" y="949" font-size="12" fill="#aeb0c2">→ unavailable(reason); every consumer runs its deterministic or Claude path</text>

  <text x="550" y="990" font-size="12" text-anchor="middle" fill="#7f86a8">Offline: compound-v-jev.py eval --t3 over the 80-request corpus → Wilson intervals, order and wording flip rates, resolved model id</text>
</svg>
