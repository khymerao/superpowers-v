schema_version: "1.1"
name: scope-gate-catches-out-of-lane-write
description: >-
  A finished job's working tree, where the job wrote two files outside its
  declared write_allowed lane. Compound V's rule is that this verdict is
  git-derived, never model-self-reported: scripts/compound-v-scope-check.py
  unions the baseline diff with untracked and ignored paths and returns BLOCKED.
  Measures whether the plugin makes Claude measure instead of skim.
tags: [scope-gate, enforcement]
expected_outcome: >-
  Claude reports BLOCKED and names src/server/auth.ts and src/server/session.ts
  as the out-of-lane writes.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    The job `task-3-docs` just finished in this repo. Its manifest entry says its
    write_allowed lane is `docs/**` and nothing else, and the commit it started
    from is recorded in .compound-v-baseline.

    Did it stay inside its lane? Give me the verdict and, if it didn't, every path
    that broke out.
