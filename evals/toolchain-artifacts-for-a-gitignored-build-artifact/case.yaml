schema_version: "1.1"
name: toolchain-artifacts-for-a-gitignored-build-artifact
description: >-
  The discoverability probe. `toolchain_artifacts` is a v3.6.3 manifest field
  documented only inside the plugin (skills/compound-v/execution-manifest.md).
  A model with no plugin cannot name it. The case asks the question a user hits
  in practice — the scope gate BLOCKED a job over a build artifact the test floor
  itself wrote — and checks whether the plugin surfaces its own answer.
  No fixture and no Bash: the whole point is whether the knowledge is reachable.
tags: [docs, discoverability, scope-gate]
expected_outcome: >-
  Claude names `toolchain_artifacts`, puts it at the top level of the manifest,
  and states the gitignore condition (a path is only forgiven when git
  check-ignore confirms it is ignored at gate time).
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My Compound V scope gate keeps BLOCKING a job over `tsconfig.tsbuildinfo`.
    The job never wrote it on purpose — the test floor does, the first time `tsc`
    runs in a fresh worktree. The file is gitignored.

    I don't want to widen the job's write_allowed to cover it, because that lane is
    the whole point. Is there a supported way to declare this, and what exactly do
    I have to put where?
