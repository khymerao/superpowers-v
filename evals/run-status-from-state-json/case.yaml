schema_version: "1.1"
name: run-status-from-state-json
description: >-
  A halted run's state.json, read back as a status report. This is the suite's
  CONTROL case: reading a JSON file is something any model does well, so a small
  or zero delta here is the expected, honest result. It is kept because it is the
  regression tripwire for the run-directory contract itself — if state.json's
  shape changes and /v:status stops rendering it, this case is where that shows.
  Phrased in natural language, not as `/superpowers-v:v-status`, so the baseline
  arm faces the same task rather than an unknown-command error.
tags: [state, status, control]
expected_outcome: >-
  Claude reports the run is BLOCKED, names all three jobs with their statuses,
  and identifies task-2-ui as the one that failed the scope gate.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Where did my Compound V run get to? Give me the pipeline phase and a per-job
    status, and tell me which job is holding it up and why.
