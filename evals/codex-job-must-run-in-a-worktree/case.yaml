schema_version: "1.1"
name: codex-job-must-run-in-a-worktree
description: >-
  A manifest whose partition is disjoint but whose headless Codex job is set to
  isolation: direct. Compound V's invariant is codex => worktree: a Codex worker
  is a separate process with no kernel confinement to a lane, so the git-derived
  scope gate only has a per-job before/after image when the job runs in its own
  worktree. This invariant is plugin knowledge, not general knowledge — it is the
  case where the baseline arm has no way to know the answer.
tags: [manifest, isolation, gate]
expected_outcome: >-
  Claude reports the manifest is invalid, names task-1-reindex-worker, and says a
  codex job must use isolation: worktree.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Check the isolation settings on this run before I dispatch it — the manifest
    is docs/superpowers/execution/2026-02-10-search-reindex/manifest.yaml.

    The write lanes don't overlap, so I think it's fine. Am I missing anything?
