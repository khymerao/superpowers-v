schema_version: "1.1"
name: unrelated-request-does-not-trigger-compound-v
description: >-
  The over-triggering guard. Compound V is an orchestration pipeline; a read-only
  "explain this file" question is not a change request and must not pull a skill,
  a manifest or a triage tier into the answer. The doc calls this shape out
  explicitly — tool_used Skill with min 0 / max 0 and `arm: both`, so it is scored
  in BOTH arms rather than treated as a plugin-fired indicator.
tags: [negative, triggering]
expected_outcome: >-
  Claude answers the question about the file and invokes no Compound V skill.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Read src/retry.ts and explain in a couple of sentences what its backoff does
    and what happens when it runs out of attempts. I'm not changing anything, I
    just want to understand it.
