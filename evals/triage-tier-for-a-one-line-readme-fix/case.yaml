schema_version: "1.1"
name: triage-tier-for-a-one-line-readme-fix
description: >-
  A trivially small change request. Compound V's sizing engine should call this
  DIRECT — implement in place, run the floor, commit it with the record — rather
  than routing a typo through a brainstorm, three pre-flights and a dispatch.
  Two plugin mechanisms can produce that answer: hooks/triage-prompt-nudge.sh,
  which fires on UserPromptSubmit and runs compound-v-preeval.py before Claude
  reads the prompt, and the /v:triage command. The fixture ships the impact
  taxonomy because without it the engine scores every request FULL_PIPELINE
  (verified locally) — that is a real precondition, not a thumb on the scale.
tags: [triage, routing, hooks]
expected_outcome: >-
  Claude reports tier DIRECT, points at the pre-eval record, and does NOT propose
  a full orchestrate/dispatch pipeline for a one-line typo.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    README.md says "recieve" where it should say "receive". One line, no behaviour
    change, nothing else touched.

    How should this go through Compound V before I touch it? Tell me the tier and
    what it means I should do.
