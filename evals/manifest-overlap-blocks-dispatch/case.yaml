schema_version: "1.1"
name: manifest-overlap-blocks-dispatch
description: >-
  A Compound V manifest whose two parallel jobs claim overlapping write_allowed
  globs. The Iron Rule is that a run is not dispatched until the partition is
  provably disjoint; the deterministic gate is compound-v-validate-manifest.py.
  Measures whether the plugin makes Claude reach the FAIL verdict and name the
  collision, instead of eyeballing the YAML and waving it through.
tags: [manifest, partition, gate]
expected_outcome: >-
  Claude runs (or cites) the validator, reports the run is INVALID / must not be
  dispatched, and names both jobs and the src/billing path they both claim.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    I'm about to dispatch this run in parallel. The manifest is at
    docs/superpowers/execution/2026-02-03-billing-export/manifest.yaml in this repo.

    Is this partition safe to dispatch as-is? If it isn't, tell me exactly what
    is wrong and which jobs are involved.
