- AC-1 scripts/compound-v-onboard.py --selftest passes, including the new rows, and those rows fail with the exclusion predicates removed.
- AC-2 A detect_ui request built from the probe repository holds no secret-bearing file and none of the planted values, on both the git-tracked and the os.walk path.
- AC-3 scripts/compound-v-jev.py --selftest and tests/test-jev-core.sh pass; the contract check covers every unavailable/failed reason literal in vault.tsx, and a no_key response parses to unavailable/no_key.
- AC-4 prune removes a regular pending-*.json older than 30 days and keeps a fresh, a future-dated and a symlinked one; the rows fail with the change reverted.
- AC-5 The manifest full test command passes on the merged tree, and vault.tsx and jev-t3.tsx are byte-identical to the run base.
