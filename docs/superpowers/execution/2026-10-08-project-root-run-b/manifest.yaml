run_id: 2026-10-08-project-root-run-b
feature: 'One project-root rule (ADR 0005 run B): --repo or git toplevel, never __file__; one triage stream path; hooks walk up to .git'
routing_stance: balanced
max_parallel: 1
spec_path: docs/superpowers/specs/2026-10-08-project-root-run-b-design.md
plan_path: docs/superpowers/plans/2026-10-08-project-root-run-b.md
audits:
  archaeology: docs/superpowers/archaeology/2026-10-08-2026-10-08-plugin-root-resolver-design.md
  library: docs/superpowers/library-audit/2026-10-08-2026-10-08-plugin-root-resolver-design.md
triage:
  tier: FULL
  pre_eval_id: 2026-10-08T100626Z-run-b-of-adr-0005-project-root-the-project-root-is-an-explic-544f
  taxonomy_digest: sha256:73763c8ac80e3a5b5438a8330b0bb26dbb98125dc9804d3e650ec938bc13425a
  decided_at: '2026-10-08T10:06:26Z'
global_constraints:
- 'Python 3.9 stdlib only; no `match`, no `X | Y` annotations. Every fix ships a test row that fails when reverted.'
- '`resolve_project_root(repo=None, start=None)` lives in `scripts/compound-v-project-config.py`: explicit `repo` (real path, a directory) wins; else `git -C <start> rev-parse --show-toplevel`, real path; outside git `ValueError` with a message. Never `__file__`, never the current directory as a guess.'
- '`scripts/compound-v-triage-outcomes.py`: `_repo_root()` removed; every former use takes the helper; CLI gains `--repo`; outside git with no `--repo` and no `--stream` it exits non-zero and writes nothing. `STREAM_RELPATH` is the only definition of the stream path; `compound-v-preeval.py` and `compound-v-fastpath-materialize.py` load and use it (selftest literals only where they assert its value).'
- '`compound-v-validate-manifest.py` `_find_repo_root` returns `None` instead of `os.getcwd()`; each caller handles `None` explicitly (fail closed where a root is required).'
- '`hooks/precompact-snapshot.sh`, `hooks/run-band.tsx` and `hooks/brainstorm-trigger0-nudge.sh` walk up to the nearest `.git` (dir or file) like `hooks/postcompact-resume.sh:85`, same bound, same not-found result; precompact and postcompact snapshot keys agree for a subdirectory cwd. Hook output and fail-silent behaviour otherwise unchanged.'
- 'Command prose that calls triage-outcomes without `--stream` changes only if it runs from somewhere other than the project root (read each; edit only those).'
- '`compound-v-jev.py`, `compound-v-memory.py`, `hooks/lane-guard.sh`, `evals/` are not touched; the review record justifies in writing what stays (spec item 7).'
- 'No version bump, CHANGELOG or release. Commit subjects are plain sentences, no Co-Authored-By trailer.'
acceptance_criteria:
- AC-1 Every test in the spec's Tests section passes and each fails when its change is reverted.
- AC-2 No script under scripts/ derives a project root from __file__ outside a selftest.
- AC-3 Full suite, lint-frontmatter.py . and shellcheck hooks/*.sh green.
test_contract:
  floor_command: bash -c 'bash tests/test-project-root.sh >/dev/null && /usr/bin/python3 -B scripts/compound-v-triage-outcomes.py --selftest >/dev/null && echo floor-ok'
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  timeout_s: 540
  impacted_map:
  - when: scripts/compound-v-*.py
    run: bash -c 'for s in project-config triage-outcomes preeval fastpath-materialize validate-manifest; do /usr/bin/python3 -B scripts/compound-v-$s.py --selftest >/dev/null || { echo FAIL $s; exit 1; }; done; bash tests/test-project-root.sh >/dev/null && echo py-ok'
  - when: hooks/*
    run: bash -c 'shellcheck hooks/*.sh && bash tests/test-native-points.sh >/dev/null && bash tests/test-skill-nudges.sh >/dev/null && bash tests/test-run-band-mod.sh >/dev/null && bash tests/test-disabled-hooks.sh >/dev/null && bash tests/test-hook-recursion-guard.sh >/dev/null && echo hooks-ok'
  - when: '*.md'
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: tests/*.sh
    run: bash -c 'bash tests/test-project-root.sh >/dev/null && bash tests/test-native-points.sh >/dev/null && bash tests/test-skill-nudges.sh >/dev/null && echo tests-ok'
