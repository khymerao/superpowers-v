  acceptance:
  - AC-1..AC-3 rows pass and each fails on revert; the selftests, hook tests, test-jev-core, test-jev-t3-mod, lint and shellcheck green; no live call made.
  body: 'Implement Task A of docs/superpowers/plans/2026-10-08-t3-measurement-and-eval.md (A1..A6). Read the spec docs/superpowers/specs/2026-10-08-t3-measurement-and-eval-design.md and its Pre-flight amendments, and both audits (section 7) first. Tests first. Make no live Claude or Jev call. Touch only your lane. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return.'
- id: spec-review
  title: Review Gate — deep, three passes against the spec, its amendments and AC-1..AC-4
  type: review
  backend: claude
  tier: deep
  effort: high
  isolation: direct
  run: serial
  depends_on:
  - measure-eval
  write_allowed:
  - docs/superpowers/dogfood/2026-10-08-t3-measurement-and-eval-review.md
  - .claude/agent-memory/superpowers-v-spec-reviewer/**
  read_allowed:
  - '**'
  acceptance:
  - 'The review file exists with ## Recall, ## SPEC, ## QUALITY, ## INTEGRATION, ## Verdict; each AC run on the merged tree with command and output quoted; verdict APPROVED or ISSUES with a numbered list.'
  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). HARD BUDGET of 40 tool calls; FIRST action after Step 0: create docs/superpowers/dogfood/2026-10-08-t3-measurement-and-eval-review.md with the section skeleton. Review against docs/superpowers/specs/2026-10-08-t3-measurement-and-eval-design.md (amendments override). Check: the trust rule; total_cost_usd never stored; null not 0; hook stdout and two tab fields unchanged; no request text in pairs or results; the frozen digest excludes labels; the report decides on human_label only and says not decidable when labels are missing. Revert checks only in a scratch copy. Your memory directory is .claude/agent-memory/superpowers-v-spec-reviewer/; keep memory frontmatter valid YAML. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return.'
