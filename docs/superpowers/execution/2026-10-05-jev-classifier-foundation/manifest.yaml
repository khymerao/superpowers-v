run_id: 2026-10-05-jev-classifier-foundation
feature: 'Jev (TypeSafe System One via OpenRouter) beside Compound V''s classifiers, shadow-first: compound-v-vault plugin as key holder and only HTTP client, key-free compound-v-jev.py layer, record t3 block, T3 shadow, deterministic detect_ui floor plus Jev for UI and onboarding layers, synthetic corpus and eval'
routing_stance: balanced
max_parallel: 6
spec_path: docs/superpowers/specs/2026-10-05-jev-classifier-foundation-design.md
plan_path: docs/superpowers/plans/2026-10-05-jev-classifier-foundation.md
audits:
  archaeology: docs/superpowers/archaeology/2026-10-05-2026-10-05-jev-classifier-foundation-design.md
  domain: docs/superpowers/expert/2026-10-05-2026-10-05-jev-classifier-foundation-design.md
  library: docs/superpowers/library-audit/2026-10-05-2026-10-05-jev-classifier-foundation-design.md
triage:
  tier: FULL
  pre_eval_id: 2026-10-05T073820Z-build-the-jev-classifier-foundation-per-docs-superpowers-pla-f291
  taxonomy_digest: sha256:73763c8ac80e3a5b5438a8330b0bb26dbb98125dc9804d3e650ec938bc13425a
  decided_at: '2026-10-05T07:38:20Z'
global_constraints:
- Python 3.9 syntax, stdlib only; no `typesafe_sdk`; no `match`; no `X | Y` annotations.
- Never Haiku. Jev is not a Claude tier and never appears in a manifest `tier`.
- 'The OpenRouter key exists only in the vault plugin: secure storage, `options`, the `$.http.fetch` header. Never in a Python process, an env var, argv, a file, a log line, a tool result or the transcript.'
- The vault never answers a Bash tool call; `lane-guard.sh` and permission prompts stay in force.
- Request text never in argv. Local Jev data lives in `~/.claude/compound-v-jev/<repo-digest>/` (dir 0700, files 0600; `<repo-digest>` = first 16 hex of sha256 of the repo's absolute real path); retention 30 days, pruned on write. Nothing Jev-related is written under the repository except the corpus fixture and the code.
- 'Error bodies from OpenRouter carry the account''s `user_id`: never copy any part of an error body anywhere; record only the status class.'
- '`t3.mode` is `off|shadow` in spec 1. The triage decision, the record''s tier and every existing hook output are byte-identical to today on every existing fixture.'
- 'Model pinned `typesafe/jev-1.13`; record the resolved id the response returns (live: `typesafe/jev-1.13-20260917`).'
- 'No fabricated metrics: `latency_ms` measured; `usage.cost` dropped; no cost or savings text (anti-ruflo regex, `.github/workflows/validate.yml:194`).'
- Every behavioural change ships a selftest/test row that fails when the change is reverted.
- 'Docs: plain words, every claim true of HEAD, no line over 200 characters outside code/tables.'
- 'Lane discipline: touch only your `write_allowed`; `register-lane` first, with a literal `--cwd`.'
- Names fixed by the Interfaces below; do not rename. Commit subjects are plain sentences, no `feat:`/`fix:`.
- 'Not in any implementation job: version bump, CHANGELOG, marketplace entry, `.gitignore`, release (Task R).'
acceptance_criteria:
- 'AC-1 Without the vault (CV_JEV_T3 unset, no $.jev), triage, detect_ui beyond the extended floor, and onboarding behave exactly as today: every pre-existing tests/*.sh and scripts/*.py --selftest is green; lint-frontmatter and shellcheck hooks/*.sh scripts/compound-v-*.sh pass.'
- AC-2 With the vault and t3.mode shadow, a T3 consultation leaves one shadow pair in ~/.claude/compound-v-jev/<repo-digest>/shadow-pairs.jsonl and the triage decision and hook output are unchanged.
- AC-3 t3.mode accepts only off|shadow; active is coerced to shadow with a warning.
- 'AC-4 The OpenRouter key appears in no file, transcript row, command line, Python process or env var: the vault tests and a grep of the diff for sk-or-, Bearer, openrouter_key, user_id outside plugins/compound-v-vault show none.'
- AC-5 compound-v-jev.py eval --t3 prepares request files from tests/fixtures/jev-t3-corpus.jsonl and writes a report with n, Wilson intervals, strictness inversions (3/n when zero), order-flip and wording-flip rates, a probability histogram, the share of hard 0/1 answers and the resolved model id(s), with no cost text.
- AC-6 A WordPress theme fixture is detected as UI deterministically; a docs site with only .html stays no-ui.
test_contract:
  floor_command: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  timeout_s: 540
  impacted_map:
  - when: scripts/compound-v-preeval.py
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-preeval.py --selftest >/dev/null && bash tests/test-native-points.sh >/dev/null && echo preeval-ok'
  - when: schemas/*.json
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-preeval.py --selftest >/dev/null && bash tests/test-engine-c-contract.sh >/dev/null && echo schemas-ok'
  - when: scripts/compound-v-project-config.py
    run: /usr/bin/python3 -B scripts/compound-v-project-config.py --selftest
  - when: scripts/compound-v-jev.py
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-jev.py --selftest >/dev/null && bash tests/test-jev-core.sh >/dev/null && echo jev-ok'
  - when: tests/test-jev-core.sh
    run: bash tests/test-jev-core.sh
  - when: plugins/compound-v-vault/**
    run: bash tests/test-vault-mod.sh
  - when: tests/test-vault-mod.sh
    run: bash tests/test-vault-mod.sh
  - when: scripts/compound-v-onboard.py
    run: /usr/bin/python3 -B scripts/compound-v-onboard.py --selftest
  - when: tests/fixtures/jev-t3-corpus.jsonl
    run: bash -c '/usr/bin/python3 -B -c "import json;[json.loads(l) for l in open(\"tests/fixtures/jev-t3-corpus.jsonl\") if l.strip()]" && echo corpus-ok'
  - when: hooks/triage-prompt-nudge.sh
    run: bash -c 'shellcheck hooks/*.sh && bash tests/test-native-points.sh >/dev/null && bash tests/test-hook-recursion-guard.sh >/dev/null && echo hook-ok'
  - when: tests/test-native-points.sh
    run: bash tests/test-native-points.sh
  - when: hooks/*.tsx
    run: bash -c 'bash tests/test-jev-t3-mod.sh >/dev/null && bash tests/test-run-band-mod.sh >/dev/null && echo mods-ok'
  - when: hooks/hooks.json
    run: bash -c 'bash tests/test-native-points.sh >/dev/null && bash tests/test-jev-t3-mod.sh >/dev/null && echo hooksjson-ok'
  - when: types/index.d.ts
    run: bash tests/test-jev-t3-mod.sh
  - when: commands/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: skills/**/*.md
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  - when: '*.md'
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
