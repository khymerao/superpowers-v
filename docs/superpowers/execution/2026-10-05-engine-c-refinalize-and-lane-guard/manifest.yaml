global_constraints:
- 'Python 3.9 syntax, stdlib only; no `match`; no `X | Y` annotations or `isinstance(x, A | B)`.'
- 'The hook stays filesystem-only on its resolution path: no `git` subprocess.'
- Every behavioural change ships a test row that fails when the change is reverted.
- The short-circuit merges nothing and writes nothing; it never weakens what the authority decides for a wave it runs on.
- No fabricated metrics; no timing numbers in docs; no cost or savings text.
- 'Docs: plain words, every claim true of HEAD, no line over 200 characters outside code/tables.'
- 'Lane discipline: touch only your `write_allowed`; `register-lane` first, with a literal `--cwd`. Run python with `-B`.'
- 'Not in any implementation job: version bump, CHANGELOG, `plugin.json`, `marketplace.json`.'
- 'Commit subjects are plain sentences, no `feat:`/`fix:`; no Co-Authored-By trailer.'
acceptance_criteria:
- AC-1 scripts/compound-v-emit-workflow.py --selftest passes with rows A-E and the exempt row; row A fails with the call to _already_integrated_wave removed.
- AC-2 tests/test-lane-guard.sh passes with the new rows; the nested-worktree row fails with the boundary check removed, and the finding-78 rows (registered worktree holding a .git file) fail if the check also inspects wt itself.
- AC-3 shellcheck hooks/*.sh is clean, and the manifest full test command passes on the merged tree.
- AC-4 In a full-depth scratch clone, re-running finalize-wave on wave 1 of 2026-10-05-jev-classifier-foundation exits 0 and leaves that clone's state.json byte-identical.
test_contract:
  floor_command: /usr/bin/python3 -B scripts/lint-frontmatter.py .
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  timeout_s: 540
  impacted_map:
  - when: scripts/compound-v-emit-workflow.py
    run: bash -c '/usr/bin/python3 -B scripts/compound-v-emit-workflow.py --selftest >/dev/null && bash tests/test-engine-c-contract.sh >/dev/null && echo emit-ok'
  - when: hooks/lane-guard.sh
    run: bash -c 'shellcheck hooks/*.sh && bash tests/test-lane-guard.sh >/dev/null && echo guard-ok'
  - when: tests/test-lane-guard.sh
    run: bash tests/test-lane-guard.sh
  - when: '*.md'
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
