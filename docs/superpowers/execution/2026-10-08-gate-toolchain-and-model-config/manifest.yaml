  body: 'Your agent definition carries the three-pass Review Gate and a Step 0 (V-memory recall). HARD BUDGET of 40 tool calls; FIRST action after Step 0: create docs/superpowers/dogfood/2026-10-08-gate-toolchain-and-model-config-review.md with the section skeleton. Review against docs/superpowers/specs/2026-10-08-gate-toolchain-and-model-config-design.md (amendments override). Check: one toolchain_artifacts reader, no copy; the gate test uses a direct job and fails on the old gate; resolve() and load_config_models unchanged for in-process callers; --explicit-model works outside git; the five docs updated. Revert checks only in a scratch copy. Your memory directory is .claude/agent-memory/superpowers-v-spec-reviewer/; keep memory frontmatter valid YAML. Run python with -B; register your lane with a literal --cwd. You are unattended: decide and return.'
