global_constraints:
- 'Python 3.9 stdlib only. Every fix ships a test row that fails when reverted.'
- 'The `toolchain_artifacts` reader lives once, in `scripts/compound-v-scope-check.py`; the emitter and the gate call it; no copy. The gate passes each glob as `--toolchain-artifact` in `run_scope_check`.'
- 'Claims are limited to `contradicted` and false `blocked`; `.DS_Store`-style files stay violations unless declared.'
- 'The gate test uses a direct job, a really gitignored file and a receipt made with `--toolchain-artifact`.'
- 'resolve-model: the new default lives in `main()` only; one root for models and the effort cap; fail closed outside git, except `--explicit-model`. `resolve()` and `load_config_models` are unchanged for in-process callers.'
- '`resolve_job_model` in the emitter and `agents/parallel-dispatcher.md:150` pass `--repo-dir`.'
- 'The five docs named in spec amendment 6 are updated in the same change.'
- 'No version bump, CHANGELOG or release. Commit subjects are plain sentences, no Co-Authored-By trailer.'
acceptance_criteria:
- AC-1 The gate row and the resolve-model rows pass and each fails when its change is reverted.
- AC-2 Full suite, lint-frontmatter.py . and shellcheck green.
test_contract:
  floor_command: bash -c 'bash tests/test-integration-gate.sh >/dev/null && /usr/bin/python3 -B scripts/compound-v-resolve-model.py --selftest >/dev/null && echo floor-ok'
  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  timeout_s: 540
  impacted_map:
  - when: scripts/compound-v-*.py
    run: bash -c 'for s in scope-check integration-gate emit-workflow resolve-model; do /usr/bin/python3 -B scripts/compound-v-$s.py --selftest >/dev/null || { echo FAIL $s; exit 1; }; done; bash tests/test-integration-gate.sh >/dev/null && bash tests/test-engine-c-contract.sh >/dev/null && echo py-ok'
  - when: tests/*.sh
    run: bash -c 'bash tests/test-integration-gate.sh >/dev/null && for t in tests/test-resolve-model.sh; do [ -f "$t" ] && bash "$t" >/dev/null; done; echo tests-ok'
  - when: '*.md'
    run: /usr/bin/python3 -B scripts/lint-frontmatter.py .
jobs:
