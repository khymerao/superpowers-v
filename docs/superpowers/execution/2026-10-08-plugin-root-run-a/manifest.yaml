  full_command: bash -c 'for s in scripts/compound-v-*.py; do grep -q -- "--selftest" "$s" || continue; /usr/bin/python3 -B "$s" --selftest >/dev/null 2>&1 || { echo "FAIL $s"; exit 1; }; done; for t in tests/*.sh; do bash "$t" >/dev/null 2>&1 || { echo "FAIL $t"; exit 1; }; done; echo all-tests-ok'
  timeout_s: 540
  impacted_map:
  - when: '*.md'
    run: bash -c '/usr/bin/python3 -B scripts/lint-frontmatter.py . >/dev/null && bash tests/test-plugin-root.sh >/dev/null && echo md-ok'
  - when: hooks/session-banner.sh
    run: bash -c 'shellcheck hooks/*.sh && bash tests/test-plugin-root.sh >/dev/null && bash tests/test-disabled-hooks.sh >/dev/null && bash tests/test-session-banner-staleness.sh >/dev/null && bash tests/test-hook-recursion-guard.sh >/dev/null && echo hook-ok'
  - when: tests/test-plugin-root.sh
    run: bash -c 'shellcheck tests/test-plugin-root.sh && bash tests/test-plugin-root.sh'
